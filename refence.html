<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#061724" />
		<title>任务管理 · 智能机器人系统</title>
		<style>
			:root {
				color-scheme: dark;
				--bg: #061724;
				--cyan: #00cfff;
				--blue: #009dff;
				--text: #d9edff;
				--muted: #83a8c2;
				--line: #28546b;
				--panel: rgba(12, 34, 49, 0.86);
				--font:
					'Bahnschrift', 'Microsoft YaHei UI', 'Microsoft YaHei',
					'PingFang SC', sans-serif;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font: 14px var(--font);
				font-weight: 400;
			}
			button,
			input,
			select {
				font: inherit;
			}
			button {
				cursor: pointer;
			}
			button,
			a,
			input,
			select {
				outline: none;
			}
			button {
				color: inherit;
			}
			button:focus-visible,
			a:focus-visible {
				outline: 2px solid #63e7ff;
				outline-offset: 3px;
			}
			button:disabled {
				cursor: default;
				opacity: 0.38;
			}
			button svg {
				pointer-events: none;
			}
			input,
			select {
				color: var(--text);
				min-width: 0;
			}
			input::placeholder {
				color: #718fa5;
			}
			input:focus,
			select:focus {
				border-color: var(--cyan) !important;
				box-shadow: 0 0 10px #00cfff20;
			}
			button {
				transition:
					background 0.18s,
					border-color 0.18s,
					box-shadow 0.18s;
			}
			svg {
				vertical-align: middle;
			}
			.icon {
				width: 20px;
				height: 20px;
				fill: none;
				stroke: currentColor;
				stroke-width: 1.7;
				stroke-linecap: round;
				stroke-linejoin: round;
				flex: none;
			}
			.icon.small {
				width: 15px;
				height: 15px;
			}
			.defs {
				position: absolute;
				width: 0;
				height: 0;
				overflow: hidden;
			}
			h1,
			h2,
			p {
				margin: 0;
			}
			button {
				border: 0;
				background: none;
			}
			.app {
				height: 100dvh;
				min-height: 850px;
				display: flex;
				flex-direction: column;
				position: relative;
				isolation: isolate;
				overflow: hidden;
				background:
					radial-gradient(
						ellipse at 65% 2%,
						#0c31494d,
						transparent 50%
					),
					radial-gradient(
						ellipse at 43% 72%,
						#0066950b,
						transparent 65%
					);
			}
			.app:before {
				content: '';
				position: absolute;
				inset: 60px 0 0;
				z-index: -2;
				pointer-events: none;
				background-image:
					radial-gradient(#23789885 0.7px, transparent 0.9px),
					linear-gradient(#0e476a22 1px, transparent 1px),
					linear-gradient(90deg, #0e476a1a 1px, transparent 1px);
				background-size:
					24px 24px,
					120px 120px,
					120px 120px;
				mask-image: linear-gradient(#000a, #0003 40%, #0008);
			}
			.app:after {
				content: '';
				position: absolute;
				inset: 62px 0 74px;
				z-index: -1;
				pointer-events: none;
				border-left: 1px solid #04719b55;
				border-right: 1px solid #04719b55;
				background: linear-gradient(
					90deg,
					transparent 10%,
					#00a3d810 10.05%,
					transparent 10.1%,
					transparent 88%,
					#00a3d811 88.05%,
					transparent 88.1%
				);
			}
			.factory {
				position: absolute;
				right: 0;
				top: 0;
				width: 69%;
				height: 300px;
				z-index: -2;
				opacity: 0.76;
				pointer-events: none;
				mask-image:
					linear-gradient(90deg, transparent, #000 20%),
					linear-gradient(#000 20%, transparent 90%);
				mask-composite: intersect;
			}
			.topbar {
				height: 62px;
				flex: none;
				display: flex;
				align-items: center;
				padding: 0 30px 0 35px;
				gap: 22px;
				border-bottom: 1px solid #2a5f795e;
				background: linear-gradient(
					90deg,
					#20394c88,
					#0a2332a8 34%,
					#0c233175
				);
				position: relative;
				box-shadow: 0 4px 22px #0003;
			}
			.topbar:after {
				content: '';
				position: absolute;
				bottom: -2px;
				left: 0;
				right: 0;
				height: 3px;
				background: linear-gradient(
					90deg,
					transparent 2%,
					#08caff 2%,
					#08caff 4.5%,
					transparent 4.5%,
					transparent 15%,
					#00cfff99 15.1%,
					transparent 40%,
					#00cfff22 75%,
					transparent 90%
				);
				pointer-events: none;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 17px;
				white-space: nowrap;
				flex: none;
			}
			.brand-logo {
				width: 42px;
				height: 43px;
				filter: drop-shadow(0 0 5px #007dff44);
			}
			.brand-name {
				font-weight: 650;
				font-size: 22px;
				letter-spacing: 2px;
				text-shadow: 0 0 8px #58b4ff33;
			}
			.brand-en {
				font-size: 8px;
				letter-spacing: 2.3px;
				color: #88c7e8;
				margin-top: 2px;
			}
			.top-nav {
				display: flex;
				align-self: stretch;
				align-items: stretch;
				position: relative;
				margin-left: 7px;
				padding: 0 16px;
			}
			.top-nav:before {
				content: '';
				position: absolute;
				inset: 0 -26px 4px -13px;
				border: 1px solid #2389b84d;
				transform: skewX(-39deg);
				border-top: 0;
				border-radius: 0 0 5px 18px;
				background: linear-gradient(0deg, #0081c414, transparent);
				pointer-events: none;
			}
			.top-link {
				position: relative;
				padding: 0 19px;
				display: flex;
				align-items: center;
				gap: 9px;
				white-space: nowrap;
			}
			.top-link + .top-link:before {
				content: '';
				position: absolute;
				left: 0;
				height: 20px;
				width: 1px;
				background: #2960783b;
			}
			.top-link.active {
				color: #e9fbff;
				text-shadow: 0 0 7px #39d9ff;
				font-weight: 600;
				background: radial-gradient(
					ellipse at bottom,
					#007dce44,
					transparent 80%
				);
			}
			.top-link.active:after {
				content: '';
				position: absolute;
				bottom: 7px;
				left: 16px;
				right: 16px;
				height: 3px;
				background: #05d7ff;
				box-shadow:
					0 0 8px #00c8ff,
					0 0 17px #0087ff;
			}
			.top-link.active .icon {
				color: #00d8ff;
				filter: drop-shadow(0 0 4px #00aaff);
			}
			.top-spacer {
				flex: 1;
			}
			.global-search {
				width: 312px;
				height: 33px;
				border: 1px solid #35607a;
				border-radius: 20px;
				display: flex;
				align-items: center;
				padding: 0 12px;
				gap: 8px;
				box-shadow: inset 0 0 9px #001725;
				background: #0517277a;
			}
			.global-search input {
				border: 0;
				background: none;
				width: 100%;
				font-size: 12px;
				padding: 0;
				box-shadow: none;
			}
			.global-search .icon {
				width: 16px;
				height: 16px;
			}
			.header-actions {
				display: flex;
				align-items: center;
				gap: 19px;
			}
			.icon-btn {
				position: relative;
				display: grid;
				place-items: center;
				padding: 0;
				width: 25px;
				height: 29px;
				color: #b9def4;
			}
			.icon-btn:hover {
				color: var(--cyan);
			}
			.notice-dot {
				position: absolute;
				width: 7px;
				height: 7px;
				background: #ff405c;
				border: 1px solid #ff94a6;
				box-shadow: 0 0 5px #ff324470;
				border-radius: 50%;
				top: 2px;
				right: 0;
			}
			.clock {
				font-size: 14px;
				white-space: nowrap;
				letter-spacing: 0.4px;
				margin-left: 2px;
			}
			.user-area {
				border-left: 1px solid #36607a55;
				display: flex;
				align-items: center;
				gap: 12px;
				padding-left: 20px;
				min-width: 144px;
				text-align: left;
			}
			.avatar {
				width: 33px;
				height: 33px;
				border: 1px solid #2098ef;
				border-radius: 50%;
				display: grid;
				place-items: center;
				background: radial-gradient(
					circle at 30% 20%,
					#26d9ff,
					#045dff 62%,
					#0344b0
				);
				box-shadow: 0 0 12px #00a9ff4f;
				color: white;
				font-size: 14px;
			}
			.user-info strong {
				display: block;
				font-size: 14px;
				font-weight: 450;
			}
			.user-info span {
				display: block;
				font-size: 11px;
				color: #7997ae;
				margin-top: 2px;
			}
			.user-area > .icon {
				margin-left: 8px;
			}
			.main {
				flex: 1;
				display: flex;
				flex-direction: column;
				padding: 0 24px;
				min-height: 0;
			}
			.page-heading {
				height: 71px;
				flex: none;
				display: flex;
				align-items: center;
				gap: 22px;
				padding-left: 9px;
				position: relative;
			}
			.page-heading h1 {
				font-size: 29px;
				letter-spacing: 1.2px;
				font-weight: 650;
				text-shadow: 0 0 15px #38b7ff30;
			}
			.page-heading p {
				color: #a5c8dd;
				font-size: 13px;
				letter-spacing: 0.35px;
				padding-top: 9px;
			}
			.slogan {
				margin-left: auto;
				padding-right: 258px;
				color: #6fb3d5;
				letter-spacing: 5px;
				font-size: 13px;
				padding-top: 5px;
				white-space: nowrap;
			}
			.stats {
				display: grid;
				grid-template-columns: repeat(6, minmax(0, 1fr));
				gap: 13px;
				height: 103px;
				flex: none;
				margin-bottom: 14px;
			}
			.stat {
				--accent: #00baff;
				position: relative;
				text-align: left;
				border: 1px solid #327193;
				border-radius: 6px;
				padding: 16px 16px 12px 20px;
				display: flex;
				gap: 23px;
				align-items: flex-start;
				background: linear-gradient(
					112deg,
					#112d4099,
					#11293bdf 80%,
					#153449b8
				);
				box-shadow:
					inset 0 0 0 3px #041621,
					0 0 6px #00a5fa17;
				overflow: hidden;
			}
			.stat:before {
				content: '';
				position: absolute;
				inset: 4px;
				border-top: 1px solid #6dbfe12f;
				border-left: 1px solid #79b4d022;
				border-radius: 4px;
				pointer-events: none;
			}
			.stat:after {
				content: '';
				position: absolute;
				left: 0;
				top: 7px;
				width: 1px;
				height: 53px;
				background: var(--accent);
				box-shadow: 0 0 9px var(--accent);
			}
			.stat:hover,
			.stat.selected {
				border-color: var(--accent);
				box-shadow:
					inset 0 0 0 3px #061a25,
					0 0 12px #00bbff25;
			}
			.stat-icon {
				position: relative;
				border: 1px solid
					color-mix(in srgb, var(--accent) 70%, transparent);
				background: radial-gradient(
					circle,
					color-mix(in srgb, var(--accent) 30%, transparent),
					#061727 76%
				);
				border-radius: 11px;
				width: 50px;
				height: 50px;
				display: grid;
				place-items: center;
				flex: none;
				box-shadow:
					inset 0 0 7px
						color-mix(in srgb, var(--accent) 24%, transparent),
					0 0 17px color-mix(in srgb, var(--accent) 12%, transparent);
			}
			.stat-icon:before {
				content: '';
				position: absolute;
				inset: 12px;
				background: var(--accent);
				filter: blur(8px);
				opacity: 0.8;
			}
			.stat-icon .icon {
				width: 29px;
				height: 29px;
				position: relative;
				color: #e5faff;
				stroke-width: 2.2;
				filter: drop-shadow(0 0 5px var(--accent));
			}
			.stat-icon .solid-icon {
				width: 32px;
				height: 32px;
				stroke-width: 1.7;
			}
			.stat-copy {
				position: relative;
				z-index: 1;
				white-space: nowrap;
			}
			.stat-label {
				font-size: 13px;
				margin: 1px 0 6px;
			}
			.stat-value {
				font-size: 23px;
				line-height: 25px;
				font-weight: 500;
				color: var(--blue);
				font-variant-numeric: tabular-nums;
				letter-spacing: 0.1px;
			}
			.stat-note {
				font-size: 12px;
				margin-top: 6px;
				white-space: nowrap;
			}
			.stat-note .good {
				color: #00efb1;
				margin-left: 3px;
			}
			.stat-note .muted {
				color: #85a4bb;
			}
			.sparkline {
				position: absolute;
				right: 11px;
				bottom: 19px;
				width: 62px;
				height: 41px;
				color: var(--accent);
				filter: drop-shadow(
					0 0 4px color-mix(in srgb, var(--accent) 35%, transparent)
				);
			}
			.stat.completed {
				--accent: #00e5a3;
			}
			.stat.executing {
				--accent: #008dff;
			}
			.stat.queued {
				--accent: #ff981d;
			}
			.stat.cancelled {
				--accent: #a9d7ff;
			}
			.stat.cancelled .stat-value {
				color: #ebf3ff;
			}
			.stat.failed {
				--accent: #ff314e;
			}
			.stat.failed .stat-value {
				color: #ff405b;
			}
			.tech-panel {
				position: relative;
				background: linear-gradient(
					110deg,
					#0e293cc9,
					#0c202edf 50%,
					#102b3dce
				);
				border: 1px solid #397a99;
				border-radius: 5px;
				box-shadow:
					inset 0 0 0 3px #041622,
					inset 0 0 24px #05659713,
					0 0 8px #00a5ff10;
			}
			.tech-panel:before,
			.tech-panel:after {
				content: '';
				position: absolute;
				inset: -2px;
				pointer-events: none;
				z-index: 2;
				background:
					linear-gradient(var(--cyan), var(--cyan)) left top/12px 2px
						no-repeat,
					linear-gradient(var(--cyan), var(--cyan)) left top/2px 12px
						no-repeat,
					linear-gradient(var(--cyan), var(--cyan)) right top/12px 2px
						no-repeat,
					linear-gradient(var(--cyan), var(--cyan)) right top/2px 12px
						no-repeat,
					linear-gradient(var(--cyan), var(--cyan)) left bottom/12px
						2px no-repeat,
					linear-gradient(var(--cyan), var(--cyan)) left bottom/2px
						12px no-repeat,
					linear-gradient(var(--cyan), var(--cyan)) right bottom/12px
						2px no-repeat,
					linear-gradient(var(--cyan), var(--cyan)) right bottom/2px
						12px no-repeat;
				clip-path: polygon(
					6px 0,
					calc(100% - 6px) 0,
					100% 6px,
					100% calc(100% - 6px),
					calc(100% - 6px) 100%,
					6px 100%,
					0 calc(100% - 6px),
					0 6px
				);
			}
			.tech-panel:after {
				inset: 5px;
				background:
					linear-gradient(90deg, #00cfff70, transparent) left
						top/110px 1px no-repeat,
					linear-gradient(90deg, transparent, #00cfff70) right
						bottom/110px 1px no-repeat,
					linear-gradient(#00cfff88, transparent) left top/1px 30px
						no-repeat;
			}
			.filters {
				height: 152px;
				margin-bottom: 14px;
				flex: none;
				padding: 0 22px 17px 28px;
				transition: height 0.2s;
			}
			.panel-heading {
				height: 47px;
				display: flex;
				align-items: center;
				gap: 11px;
			}
			.panel-heading > .icon {
				color: var(--cyan);
			}
			.panel-heading h2 {
				font-size: 16px;
				font-weight: 600;
				white-space: nowrap;
			}
			.heading-rule {
				height: 1px;
				flex: 1;
				background: linear-gradient(90deg, #47758d33, #38657b14);
				margin: 0 16px 0 7px;
			}
			.collapse-button {
				display: flex;
				align-items: center;
				gap: 10px;
				color: #00d0ff;
				font-size: 12px;
				padding: 4px 0 4px 20px;
			}
			.filter-grid {
				display: grid;
				grid-template-columns: repeat(4, minmax(0, 1fr));
				gap: 14px 30px;
			}
			.filter-field {
				display: flex;
				align-items: center;
				gap: 15px;
				min-width: 0;
			}
			.filter-field > label {
				white-space: nowrap;
				font-size: 13px;
				font-weight: 550;
				min-width: 56px;
			}
			.filter-field .field-box {
				flex: 1;
			}
			.field-box {
				height: 34px;
				position: relative;
				border: 1px solid #44728e;
				border-radius: 4px;
				background: linear-gradient(#102537c7, #102b3ce0);
				box-shadow: inset 0 0 5px #0004;
				display: flex;
				align-items: center;
				min-width: 0;
			}
			.field-box input,
			.field-box select {
				border: none;
				background: transparent;
				width: 100%;
				height: 100%;
				padding: 0 12px;
				font-size: 12px;
				border-radius: 4px;
				outline: none;
			}
			.field-box:focus-within {
				border-color: var(--cyan);
				box-shadow: 0 0 8px #00cfff1c;
			}
			.field-box input:focus,
			.field-box select:focus {
				box-shadow: none;
			}
			.field-box select {
				appearance: none;
				padding-right: 25px;
				color: #829eb2;
			}
			.field-box select.has-value {
				color: var(--text);
			}
			select option {
				background: #102a3c;
				color: #d5eaff;
			}
			.field-box > .icon {
				position: absolute;
				right: 11px;
				width: 15px;
				height: 15px;
				pointer-events: none;
			}
			.date-range {
				flex: 1;
				gap: 8px;
				padding: 0 10px;
				min-width: 0;
			}
			.date-range > .icon {
				position: static;
				width: 16px;
				height: 16px;
				flex: none;
			}
			.date-range input {
				width: 44%;
				padding: 0;
				min-width: 0;
				text-align: center;
				color: #9cb9ce;
			}
			.date-range input::placeholder {
				color: #839fb5;
			}
			.date-range input[type='date'] {
				font-size: 11px;
			}
			.date-range input::-webkit-calendar-picker-indicator {
				width: 11px;
				opacity: 0.6;
				cursor: pointer;
			}
			.date-separator {
				font-size: 18px;
				color: #bee9ff;
			}
			.filter-actions {
				display: flex;
				gap: 9px;
				justify-content: flex-end;
				min-width: 0;
			}
			.btn {
				border: 1px solid #49829e;
				border-radius: 5px;
				background: linear-gradient(#143346, #0b1c2a);
				height: 36px;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 7px;
				padding: 0 13px;
				white-space: nowrap;
				font-size: 13px;
				box-shadow:
					inset 0 0 0 2px #041b28,
					0 1px 3px #0005;
			}
			.btn:hover {
				border-color: #3adfff;
				background: linear-gradient(#18435a, #0c2b40);
				box-shadow: 0 0 11px #00cfff25;
			}
			.btn .icon {
				width: 17px;
				height: 17px;
			}
			.btn.search {

						stroke-opacity=".7"
					/>
					<path
						d="m300 66 28-30m-1-10 12-11h174m169-10h284m360 9 8 1 24 27m-2 0 26 24M0 15h33m1606 0h33"
						stroke="#00bfff"
						fill="none"
					/>
					<path
						d="M511 5h645"
						stroke="#00bcff"
						stroke-width="3"
						filter="url(#dock-glow)"
					/>
					<path d="M782 5h102" stroke="#87f7ff" stroke-width="1.4" />
					<path d="M16 20h47m-26 4h90M1545 20h88" stroke="#237597" />
				</svg>
				<!-- 底部中英文品牌文案统一说明机器人单机控制用途。 -->
				<div class="dock-brand">
					ROBOT CONTROL<small>ONBOARD SYSTEM</small>
				</div>
				<nav class="dock" id="dock" aria-label="系统模块导航"></nav>
				<!-- 说明控制系统部署在单台 AGV 机器人本体上。 -->
				<div class="dock-tagline">
					AGV 单机控制系统<small
						>/ &nbsp;AGV ROBOT CONTROL SYSTEM</small
					>
				</div>
			</footer>
		</div>
		<div
			class="toast-region"
			id="toasts"
			role="status"
			aria-live="polite"
		></div>
		<dialog id="modal" aria-labelledby="modalTitle">
			<div class="dialog-heading">
				<svg class="icon" id="modalIcon"><use href="#i-task" /></svg>
				<h2 id="modalTitle"></h2>
				<button class="icon-btn" id="closeModal" aria-label="关闭弹窗">
					<svg class="icon"><use href="#i-close" /></svg>
				</button>
			</div>
			<div id="modalContent"></div>
		</dialog>
		<script>
			'use strict'
			/* A self-contained prototype: generated local records, no network requests. */
			const $ = (id) => document.getElementById(id)
			const icon = (name, cls = '') =>
				`<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`
			const escapeHTML = (value) =>
				String(value ?? '').replace(
					/[&<>"']/g,
					(c) =>
						({
							'&': '&amp;',
							'<': '&lt;',
							'>': '&gt;',
							'"': '&quot;',
							"'": '&#39;',
						})[c],
				)
			const format = (value) => value.toLocaleString('en-US')
			const BASE_TOTAL = 581506
			const STORE_KEY = 'agv-dispatch-prototype-v1'
			let saved = {}
			try {
				saved =
					JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}
			} catch (_) {
				/* File mode can restrict local storage. */
			}
			let newTasks = Array.isArray(saved.tasks) ? saved.tasks : []
			let overrides =
				saved.overrides && typeof saved.overrides === 'object'
					? saved.overrides
					: {}
			const state = {
				page: 1,
				size: 10,
				filtered: null,
				filters: {},
				filterTicket: 0,
				hidden: new Set(),
				menu: null,
			}
			const vehicles = [
				'AGV-8888',
				'AGV-6666',
				'AGV-3333',
				'AGV-7777',
				'AGV-12345',
				'AGV-54321',
				'AGV-98765',
				'AGV-24680',
				'AGV-13579',
				'AGV-0001',
			]
			const sampleIds = [
				'cde8c3d40e640d79',
				'3268763fa3a84b6d',
				'3e6e4c73d3a245ef',
				'ed0fd819388b4235',
				'59980efc5f0c4a1a',
				'ab4c3bb358e34ecc',
				'fd675f3b21f647cc',
				'b6c1c8d286fb412a',
				'ae85e669cb4c4c3f',
				'park-611f1316bab9',
			]
			const sampleNames = [
				'mock-c7a1701e9f8b',
				'mock-6f172b2d09aa',
				'mock-b302665125e2',
				'mock-cdaadb458d39',
				'mock-8a22b9cee1ef',
				'mock-a53f28770bb1',
				'mock-7d8120f1c94d',
				'mock-0827e82fa39e',
				'mock-27f9786bb876',
				'park-611f1316bab9',
			]
			const statuses = {
				执行中: '',
				已完成: 'done',
				排队中: 'queue',
				已取消: 'cancel',
				已挂起: 'pause',
				已失败: 'fail',
			}
			const columns = [
				['number', '#', 40],
				['code', '任务编号', 118],
				['name', '任务名称', 124],
				['status', '任务状态', 75],
				['taskId', '任务ID', 99],
				['type', '任务类型', 72],
				['assigned', '指定车辆', 120],
				['group', '指定车组', 80],
				['vehicle', '执行车辆', 94],
				['priority', '优先级', 75],
				['started', '开始执行时间', 148],
				['ended', '结束执行时间', 120],
				['created', '创建时间', 141],
				['failure', '失败原因', 96],
				['suspended', '挂起原因', 88],
				['actions', '操作', 115],
			]
			function persist() {
				try {
					localStorage.setItem(
						STORE_KEY,
						JSON.stringify({ tasks: newTasks, overrides }),
					)
				} catch (_) {
					toast('浏览器限制本地存储，本次更改在当前页面有效')
				}
			}
			function baseStatus(n) {
				return n < 9 || (n >= 10 && n < 55)
					? '执行中'
					: n === 9 || n < 50088
						? '已取消'
						: '已完成'
			}
			function hex(n) {
				return (Math.imul(n + 1771, 2654435761) >>> 0)
					.toString(16)
					.padStart(8, '0')
			}
			function getBaseTask(n) {
				const key = 'base-' + n
				const status = baseStatus(n)
				const day =
					n < 55
						? '20'
						: String(20 - (Math.floor(n / 30000) % 20)).padStart(
								2,
								'0',
							)
				const date = '2026-09-' + day
				const seconds = [9, 0, 0, 59, 58, 53, 59, 54, 53, 52]
				const task = {
					key,
					code: sampleIds[n] || hex(n) + hex(n + 173) + hex(n + 31),
					name:
						sampleNames[n] ||
						(n % 31 === 0
							? 'charge-'
							: n % 47 === 0
								? 'park-'
								: 'mock-') +
							hex(n + 888) +
							hex(n + 16),
					status,
					taskId: n < 10 ? 'ID-209317259' : 'ID-' + (209317259 + n),
					type:
						n < 10
							? '运输任务'
							: n % 31 === 0
								? '充电任务'
								: n % 47 === 0
									? '泊车任务'
									: '运输任务',
					assigned: '测试大地图-209317259',
					group: 'A组',
					vehicle: vehicles[n % 10],
					priority: 0,
					created: date + ' 17:57:' + (n < 3 ? '59' : '52'),
					started:
						date +
						' 17:' +
						(n < 3 ? '58:' : '57:') +
						String(seconds[n % 10]).padStart(2, '0'),
					ended: status === '执行中' ? '—' : date + ' 17:57:53',
					failure: '—',
					suspended: '—',
				}
				if (n === 3) task.ended = '2026-09-20 17:57:52'
				return Object.assign(task, overrides[key] || {})
			}
			function getTask(key) {
				if (key.startsWith('base-'))
					return getBaseTask(Number(key.slice(5)))
				return newTasks.find((t) => t.key === key)
			}
			function keyAt(index) {
				return state.filtered
					? state.filtered[index]
					: index < newTasks.length
						? newTasks[index].key
						: 'base-' + (index - newTasks.length)
			}
			function totalRows() {
				return state.filtered
					? state.filtered.length
					: BASE_TOTAL + newTasks.length
			}
			function counts() {
				const c = {
					全部: BASE_TOTAL,
					已完成: 531418,
					执行中: 54,
					排队中: 0,
					已取消: 50034,
					已失败: 0,
					已挂起: 0,
				}
				for (const t of newTasks) {
					c['全部']++
					c[t.status]++
				}
				for (const [key, v] of Object.entries(overrides)) {
					if (v.status && key.startsWith('base-')) {
						c[baseStatus(Number(key.slice(5)))]--
						c[v.status]++
					}
				}
				return c
			}
			function badge(status) {
				return `<span class="status-badge ${statuses[status] || ''}">${escapeHTML(status)}</span>`
			}
			function renderStats() {
				const c = counts()
				const configs = [
					[
						'',
						'任务总数',
						'document',
						'',
						'较昨日 <span class="good">−12.6% ↓</span>',
						'2,31 9,29 17,25 26,19 32,21 40,15 49,18 62,12',
					],
					[
						'已完成',
						'已完成',
						'check',
						'completed',
						`${((c['已完成'] / c['全部']) * 100).toFixed(1)}% 完成率`,
						'2,31 9,28 18,19 24,21 31,25 40,20 46,20 55,11 62,10',
					],
					[
						'执行中',
						'执行中',
						'play',
						'executing',
						'较昨日 <span class="good">−8.1% ↓</span>',
						'2,31 10,29 18,22 25,16 32,13 40,19 48,25 55,22 62,15 68,13',
					],
					[
						'排队中',
						'排队中',
						'clock',
						'queued',
						'<span class="muted">—</span> 较昨日持平',
						'2,31 11,24 17,19 25,25 31,22 39,17 45,18 54,10 61,13 68,15',
					],
					[
						'已取消',
						'已取消',
						'cancel',
						'cancelled',
						`${((c['已取消'] / c['全部']) * 100).toFixed(1)}% 占比`,
						'2,31 8,29 17,19 22,20 29,25 37,20 43,22 51,17 59,11 65,12 69,11',
					],
					[
						'已失败',
						'已失败',
						'warning',
						'failed',
						'<span class="muted">—</span> 较昨日持平',
						'2,31 10,29 18,25 25,20 31,19 39,13 46,14 53,18 59,13 66,7',
					],
				]
				$('stats').innerHTML = configs
					.map(
						([status, label, ic, cls, note, points], i) =>
							`<button class="stat ${cls} ${state.filters.status === status && status ? 'selected' : ''}" data-status="${status}" aria-label="${label} ${format(c[status || '全部'])}，点击筛选"><span class="stat-icon">${icon(ic, i > 0 ? 'solid-icon' : '')}</span><span class="stat-copy"><span class="stat-label" style="display:block">${label}</span><span class="stat-value" style="display:block">${format(c[status || '全部'])}</span><span class="stat-note" style="display:block">${note}</span></span><svg class="sparkline" viewBox="0 0 70 45" aria-hidden="true"><defs><linearGradient id="spark-${i}" x2="0" y2="1"><stop stop-color="currentColor" stop-opacity=".2"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><polygon points="${points} 69,45 2,45" fill="url(#spark-${i})"/><polyline points="${points}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg></button>`,
					)
					.join('')
			}
			function renderTable() {
				const visible = columns.filter((c) => !state.hidden.has(c[0]))
				const width = visible.reduce((s, c) => s + c[2], 0)
				$('tableCols').innerHTML = visible
					.map((c) => `<col style="width:${(c[2] / width) * 100}%">`)
					.join('')
				$('tableHead').innerHTML =
					'<tr>' +
					visible
						.map((c) => `<th scope="col">${c[1]}</th>`)
						.join('') +
					'</tr>'
				const total = totalRows()
				state.page = Math.max(
					1,
					Math.min(state.page, Math.ceil(total / state.size) || 1),
				)
				const start = (state.page - 1) * state.size,
					end = Math.min(start + state.size, total)
				let html = ''
				for (let i = start; i < end; i++) {
					const row = getTask(keyAt(i))
					html +=
						'<tr data-key="' +
						escapeHTML(row.key) +
						'">' +
						visible
							.map((c) => {
								const k = c[0],
									v = row[k]
								if (k === 'number') return `<td>${i + 1}</td>`
								if (k === 'status')
									return `<td>${badge(v)}</td>`
								if (k === 'priority')
									return `<td><span class="priority">${escapeHTML(v)}</span></td>`
								if (k === 'actions')
									return `<td><div class="row-actions"><button class="text-button" data-action="detail" aria-label="查看任务 ${escapeHTML(row.name)} 的详情">详情</button><button class="text-button" data-action="more" aria-label="任务 ${escapeHTML(row.name)} 的更多操作" aria-expanded="false">更多${icon('down')}</button></div></td>`
								return `<td class="${v === '—' ? 'cell-muted' : ''} ${['started', 'ended', 'created'].includes(k) ? 'cell-date' : ''}" title="${escapeHTML(v)}">${escapeHTML(v)}</td>`
							})
							.join('') +
						'</tr>'
				}
				if (!total)
					html = `<tr><td colspan="${visible.length}" class="empty-state">${icon('empty')}没有找到符合条件的任务<br><span style="font-size:12px;display:block;margin-top:10px">请调整筛选条件，或点击“重置”查看全部任务</span></td></tr>`
				$('tableBody').innerHTML = html
				$('recordTotal').textContent = `（共 ${format(total)} 条）`
				$('paginationTotal').textContent = `共 ${format(total)} 条`
				renderPagination()
			}
			function renderPagination() {
				const pages = Math.max(1, Math.ceil(totalRows() / state.size))
				let list = []
				if (pages <= 6)
					list = Array.from({ length: pages }, (_, i) => i + 1)
				else if (state.page < 5) list = [1, 2, 3, 4, 5, '…', pages]
				else if (state.page > pages - 4)
					list = [
						1,
						'…',
						pages - 4,
						pages - 3,
						pages - 2,
						pages - 1,
						pages,
					]
				else
					list = [
						1,
						'…',
						state.page - 1,
						state.page,
						state.page + 1,
						'…',
						pages,
					]
				$('pageControls').innerHTML =
					`<button class="page-button" data-page="${state.page - 1}" aria-label="上一页" ${state.page === 1 ? 'disabled' : ''}>${icon('left', 'small')}</button>` +
					list
						.map((p) =>
							p === '…'
								? '<span class="page-ellipsis">···</span>'
								: `<button class="page-button ${p === state.page ? 'active' : ''} ${p === pages && pages > 6 ? 'last' : ''}" data-page="${p}" aria-label="第 ${p} 页" ${p === state.page ? 'aria-current="page"' : ''}>${p}</button>`,
						)
						.join('') +
					`<span style="margin-left:5px">跳至</span><input class="page-jump" id="pageJump" aria-label="跳转页码" type="number" min="1" max="${pages}" value="${state.page}"><span>页</span>`
			}
			function matches(task, f) {
				if (f.status && task.status !== f.status) return false
				if (f.type && task.type !== f.type) return false
				if (f.vehicle && task.vehicle !== f.vehicle) return false
				if (
					f.query &&
					![
						task.name,
						task.code,
						task.taskId,
						task.vehicle,
						task.assigned,
					]
						.join(' ')
						.toLowerCase()
						.includes(f.query.toLowerCase())
				)
					return false
				for (const field of ['created', 'started', 'ended']) {
					const start = f[field + 'Start'],
						end = f[field + 'End']
					if ((start || end) && (!task[field] || task[field] === '—'))
						return false
					const date = (task[field] || '').slice(0, 10)
					if ((start && date < start) || (end && date > end))
						return false
				}
				return true
			}
			async function applyFilters(notify = false) {
				const f = Object.fromEntries(new FormData($('filterForm')))
				f.query = f.query.trim()
				for (const field of ['created', 'started', 'ended'])
					if (
						f[field + 'Start'] &&
						f[field + 'End'] &&
						f[field + 'Start'] > f[field + 'End']
					) {
						toast('开始日期不能晚于结束日期', true)
						return
					}
				const ticket = ++state.filterTicket
				state.filters = f
				state.page = 1
				closeMenu()
				const hasFilters = Object.values(f).some(Boolean)
				if (!hasFilters) {
					state.filtered = null
					renderStats()
					renderTable()
					$('searchBtn').disabled = false
					$('searchBtn').querySelector('span').textContent = '查询'
					if (notify) toast('已显示全部任务')
					return
				}
				$('searchBtn').disabled = true
				$('searchBtn').querySelector('span').textContent = '查询中'
				const keys = newTasks
					.filter((t) => matches(t, f))
					.map((t) => t.key)
				const statusOnly =
					!!f.status &&
					!Object.entries(f).some(([k, v]) => k !== 'status' && v)
				for (let n = 0; n < BASE_TOTAL; n++) {
					const key = 'base-' + n
					if (
						f.status &&
						(overrides[key]?.status || baseStatus(n)) !== f.status
					)
						continue
					if (statusOnly || matches(getBaseTask(n), f)) keys.push(key)
					if (n % 18000 === 0) {
						await new Promise((r) => setTimeout(r, 0))
						if (ticket !== state.filterTicket) return
					}
				}
				if (ticket !== state.filterTicket) return
				state.filtered = keys
				renderStats()
				renderTable()
				$('searchBtn').disabled = false
				$('searchBtn').querySelector('span').textContent = '查询'
				if (notify) toast(`已找到 ${format(keys.length)} 条任务`)
			}
			function toast(message, error = false) {
				const el = document.createElement('div')
				el.className = 'toast' + (error ? ' error' : '')
				el.innerHTML =
					icon(error ? 'warning' : 'check') +
					'<span>' +
					escapeHTML(message) +
					'</span>'
				$('toasts').append(el)
				setTimeout(() => el.remove(), 3300)
			}
			function openModal(title, content, ic = 'task') {
				closeMenu()
				$('modalTitle').textContent = title
				$('modalIcon').innerHTML = `<use href="#i-${ic}"/>`
				$('modalContent').innerHTML = content
				if (!$('modal').open) $('modal').showModal()
			}
			function closeModal() {
				$('modal').close()
			}
			function footer(html = '') {
				return `<div class="dialog-footer">${html || '<button class="btn" data-close>关闭</button>'}</div>`
			}
			function showDetail(key) {
				const row = getTask(key)
				const fields = [
					['任务名称', row.name],
					['任务编号', row.code],
					['任务状态', badge(row.status)],
					['任务类型', row.type],
					['执行车辆', row.vehicle],
					['指定车组', row.group],
					['优先级', row.priority],
					['创建时间', row.created],
					['开始执行', row.started],
					['结束执行', row.ended],
				]
				openModal(
					'任务详情',
					`<div class="dialog-body"><dl class="detail-grid">${fields.map(([label, value]) => `<dt>${label}</dt><dd>${label === '任务状态' ? value : escapeHTML(value)}</dd>`).join('')}</dl><div class="detail-timeline"><div class="timeline-step"><i></i><span>任务创建</span></div><div class="timeline-step ${row.status === '排队中' ? 'inactive' : ''}"><i></i><span>分配车辆</span></div><div class="timeline-step ${row.status === '排队中' ? 'inactive' : ''}"><i></i><span>执行任务</span></div><div class="timeline-step ${['已完成', '已取消', '已失败'].includes(row.status) ? '' : 'inactive'}"><i></i><span>${row.status === '已取消' ? '任务取消' : '任务结束'}</span></div></div></div>${footer()}`,
					'folder',
				)
			}
			function showCreate(source) {
				openModal(
					source ? '复制任务' : '创建任务',
					`<form id="createForm"><div class="dialog-body form-layout"><label class="form-group full">任务名称 <span class="required" style="display:none">*</span><input name="name" aria-label="新任务名称" placeholder="请输入任务名称" required maxlength="80" value="${source ? escapeHTML(source.name + '-副本') : ''}"></label><label class="form-group">任务类型<select name="type" aria-label="新任务类型"><option>运输任务</option><option>充电任务</option><option>泊车任务</option></select></label><label class="form-group">执行车辆<select name="vehicle" aria-label="新任务车辆">${vehicles.map((v) => `<option ${source?.vehicle === v ? 'selected' : ''}>${v}</option>`).join('')}</select></label><label class="form-group">指定车组<select name="group"><option>A组</option><option>B组</option><option>C组</option></select></label><label class="form-group">优先级<input name="priority" type="number" min="0" max="99" value="${source?.priority || 0}" required></label><label class="form-group full">目标站点<input name="station" placeholder="例如：成品库 A-01" value="${source ? escapeHTML(source.assigned) : '测试大地图-209317259'}" required maxlength="80"></label><p class="form-hint">创建后任务将进入调度队列，可在任务列表中查看详情或启动执行。</p></div>${footer('<button class="btn" type="button" data-close>取消</button><button class="btn primary" type="submit">' + icon('plus') + '创建任务</button>')}</form>`,
					'plus',
				)
			}

			}
			function xlsx(rows) {
				const cols = columns.filter(
					(c) =>
						!['number', 'actions'].includes(c[0]) &&
						!state.hidden.has(c[0]),
				)
				const safe = (v) =>
					escapeHTML(
						String(v ?? '').replace(
							/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,
							'',
						),
					)
				const cell = (v, x, y, style) =>
					`<c r="${excelColumn(x)}${y}" t="inlineStr"${style ? ' s="1"' : ''}><is><t xml:space="preserve">${safe(v)}</t></is></c>`
				let body =
					'<row r="1" ht="28" customHeight="1">' +
					cols.map((c, x) => cell(c[1], x, 1, true)).join('') +
					'</row>'
				body += rows
					.map(
						(row, y) =>
							`<row r="${y + 2}">` +
							cols
								.map((c, x) => cell(row[c[0]], x, y + 2, false))
								.join('') +
							'</row>',
					)
					.join('')
				const declaration =
					'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
				return zip([
					[
						'[Content_Types].xml',
						declaration +
							'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>',
					],
					[
						'_rels/.rels',
						declaration +
							'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
					],
					[
						'xl/workbook.xml',
						declaration +
							'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="任务列表" sheetId="1" r:id="rId1"/></sheets></workbook>',
					],
					[
						'xl/_rels/workbook.xml.rels',
						declaration +
							'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
					],
					[
						'xl/styles.xml',
						declaration +
							'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Microsoft YaHei"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Microsoft YaHei"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF15364D"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFill="1" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>',
					],
					[
						'xl/worksheets/sheet1.xml',
						declaration +
							`<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${cols.map((c, i) => `<col min="${i + 1}" max="${i + 1}" width="${['name', 'code', 'assigned'].includes(c[0]) ? 30 : ['started', 'ended', 'created'].includes(c[0]) ? 23 : 15}" customWidth="1"/>`).join('')}</cols><sheetData>${body}</sheetData><autoFilter ref="A1:${excelColumn(cols.length - 1)}${rows.length + 1}"/></worksheet>`,
					],
				])
			}
			$('exportBtn').onclick = () => {
				const total = totalRows(),
					pageCount = Math.min(
						state.size,
						total - (state.page - 1) * state.size,
					)
				if (!total) {
					toast('没有可导出的任务', true)
					return
				}
				openModal(
					'导出任务',
					`<div class="dialog-body"><label class="form-group">导出范围<select id="exportRange"><option value="page">当前页（${pageCount} 条）</option><option value="1000">当前结果前 ${Math.min(total, 1000)} 条</option>${total > 1000 ? '<option value="10000">当前结果前 ' + Math.min(total, 10000) + ' 条</option>' : ''}</select></label><p class="form-hint" style="margin-top:16px">导出当前筛选结果及所选列，生成 Excel 工作簿（.xlsx）。<br>单次最多导出 10,000 条；可先筛选任务，缩小导出范围。</p></div>${footer('<button class="btn" data-close>取消</button><button class="btn primary" id="downloadExcel">' + icon('download') + '确认导出</button>')}`,
					'download',
				)
				$('downloadExcel').onclick = async () => {
					const selected = $('exportRange').value,
						start =
							selected === 'page'
								? (state.page - 1) * state.size
								: 0,
						count =
							selected === 'page'
								? pageCount
								: Math.min(Number(selected), total)
					if (
						columns.filter(
							(c) =>
								!['number', 'actions'].includes(c[0]) &&
								!state.hidden.has(c[0]),
						).length === 0
					) {
						toast('请至少选择一个导出列', true)
						return
					}
					$('downloadExcel').disabled = true
					$('downloadExcel').textContent = '正在生成…'
					await new Promise((r) => setTimeout(r, 20))
					try {
						const rows = Array.from({ length: count }, (_, i) =>
							getTask(keyAt(start + i)),
						)
						const blob = xlsx(rows),
							url = URL.createObjectURL(blob),
							a = document.createElement('a')
						a.href = url
						a.download =
							'调度任务_' +
							new Date().toISOString().slice(0, 10) +
							'.xlsx'
						document.body.append(a)
						a.click()
						a.remove()
						setTimeout(() => URL.revokeObjectURL(url), 30000)
						closeModal()
						toast(`已导出 ${format(count)} 条任务`)
					} catch (err) {
						$('downloadExcel').disabled = false
						$('downloadExcel').textContent = '重新导出'
						toast('导出未完成，请减少导出数量后重试', true)
					}
				}
			}
			window.addEventListener('resize', closeMenu)
			$('tableScroll').addEventListener('scroll', closeMenu)
			renderStats()
			renderTable()
		</script>
	</body>
</html>
