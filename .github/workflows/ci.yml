# CI 质量门禁（规格 §16.2/§16.3）：
# 固定执行 pnpm install --frozen-lockfile → pnpm check（结构门禁 / oxlint / 类型检查 / 构建）。
# Node/pnpm 版本与 package.json#engines（node >=22.22.0）和 packageManager（pnpm@11.21.0）一致：
# pnpm 版本由 pnpm/action-setup 直接读取 packageManager 字段；Node 固定为本地实测的 22.23.1，
# 满足 engines 下限且可复现（不要改用会漂移的 "22" 这类浮动版本号）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 pnpm（版本读取 packageManager 字段）
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js（与 engines 一致的实测版本）
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: 安装依赖（frozen lockfile）
        run: pnpm install --frozen-lockfile

      - name: 完整质量链（结构门禁 / oxlint / 类型检查 / 构建）
        run: pnpm check
