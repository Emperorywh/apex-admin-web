<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>企业运营中心</title>
    <script>
      /* 首屏防闪烁：首帧渲染前按持久化主题设置 data-theme（key 与 useTheme 镜像一致） */
      try {
        var __theme = localStorage.getItem('apex-admin:theme')
        if (
          __theme === 'dark' ||
          (__theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
